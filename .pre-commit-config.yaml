repos:
    - repo: local
      hooks:
          - id: backend-format
            name: Backend Format
            entry: bash -c 'cd backend && make format'
            language: system
            files: ^backend/
            pass_filenames: false
            always_run: false
          - id: backend-lint
            name: Backend Lint
            entry: bash -c 'cd backend && make lint'
            language: system
            files: ^backend/
            pass_filenames: false
            always_run: false
          - id: backend-test
            name: Backend Test
            # Manual stage on purpose. This hook needs a reachable Docker
            # daemon for the testcontainers PostgreSQL. The real gate is
            # .github/workflows/test.yml. Run locally with:
            #   pre-commit run --hook-stage manual backend-test
            stages: [manual]
            entry: bash -c 'cd backend && make test'
            language: system
            files: ^backend/
            pass_filenames: false
            always_run: false
          - id: frontend-prettier
            name: Frontend Prettier
            entry: bash -c 'cd frontend && npm run format'
            language: system
            files: ^frontend/
            pass_filenames: false
            always_run: false
          - id: frontend-lint
            name: Frontend Lint
            entry: bash -c 'cd frontend && npm run lint'
            language: system
            files: ^frontend/
            pass_filenames: false
            always_run: false
          - id: frontend-test
            name: Frontend Test
            entry: bash -c 'cd frontend && npm run test'
            language: system
            files: ^frontend/
            pass_filenames: false
            always_run: false
