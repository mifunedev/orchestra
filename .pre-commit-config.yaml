repos:
    - repo: local
      hooks:
          - id: backend-format
            name: Backend Format
            entry: bash -c 'cd backend && make format'
            language: system
            files: ^backend/
            pass_filenames: false
            always_run: false
          - id: backend-lint
            name: Backend Lint
            entry: bash -c 'cd backend && make lint'
            language: system
            files: ^backend/
            pass_filenames: false
            always_run: false
          - id: backend-test
            name: Backend Test
            # Manual stage on purpose. This hook needs a test env file AND a
            # reachable test database; it cannot pass on a developer machine
            # that has neither, and a hook that cannot pass must not gate a
            # commit. The real gate is .github/workflows/test.yml, which runs
            # pytest against live services on every push. Run locally with:
            #   pre-commit run --hook-stage manual backend-test
            stages: [manual]
            entry: bash -c 'bash backend/scripts/precommit-test-preflight.sh && cd backend && make test ENV_FILE=../.env.test'
            language: system
            files: ^backend/
            pass_filenames: false
            always_run: false
          - id: frontend-prettier
            name: Frontend Prettier
            entry: bash -c 'cd frontend && npm run format'
            language: system
            files: ^frontend/
            pass_filenames: false
            always_run: false
          - id: frontend-lint
            name: Frontend Lint
            entry: bash -c 'cd frontend && npm run lint'
            language: system
            files: ^frontend/
            pass_filenames: false
            always_run: false
          - id: frontend-test
            name: Frontend Test
            entry: bash -c 'cd frontend && npm run test'
            language: system
            files: ^frontend/
            pass_filenames: false
            always_run: false
          - id: agents-md-claims
            name: AGENTS.md claims
            entry: bash evals/probes/docs-agents-md-claims.sh
            language: system
            files: ^(AGENTS\.md|backend/Makefile|backend/main\.py|frontend/package\.json|frontend/vite\.config\.ts|infra/docker-compose\.yml|\.pre-commit-config\.yaml|\.gitignore|evals/probes/docs-agents-md-claims\.sh|\.github/workflows/docs-claims\.yml)$
            pass_filenames: false
            always_run: false
